<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stylish Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button class="btn silver" onclick="clearDisplay()">C</button>
      <button class="btn grey" onclick="appendValue('%')">%</button>
      <button class="btn grey" onclick="appendValue('/')">÷</button>
      <button class="btn black" onclick="appendValue('*')">×</button>

      <button class="btn lavender" onclick="appendValue('7')">7</button>
      <button class="btn lavender" onclick="appendValue('8')">8</button>
      <button class="btn lavender" onclick="appendValue('9')">9</button>
      <button class="btn black" onclick="appendValue('-')">−</button>

      <button class="btn lavender" onclick="appendValue('4')">4</button>
      <button class="btn lavender" onclick="appendValue('5')">5</button>
      <button class="btn lavender" onclick="appendValue('6')">6</button>
      <button class="btn black" onclick="appendValue('+')">+</button>

      <button class="btn lavender" onclick="appendValue('1')">1</button>
      <button class="btn lavender" onclick="appendValue('2')">2</button>
      <button class="btn lavender" onclick="appendValue('3')">3</button>
      <button class="btn purple" onclick="calculate()">=</button>

      <button class="btn lavender wide" onclick="appendValue('0')">0</button>
      <button class="btn lavender" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
